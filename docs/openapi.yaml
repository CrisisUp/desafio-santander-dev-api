# Canonical OpenAPI spec for the Santander Dev Week API.
# Mirrors the annotated controllers (UserController, TransactionController) and
# the actual JSON shapes returned by the Spring Boot app, including:
#   - paged list responses (Spring Page) with page/size/sort query params
#   - plain-text error bodies (404/422) from GlobalExceptionHandler
#   - the /accounts/transactions/summary aggregate endpoint
# Generated docs (Swagger UI) live at /swagger-ui/index.html from /v3/api-docs;
# this file is the human-maintained canonical source.
openapi: 3.1.0
info:
  title: Santander Dev Week API
  description: RESTful API for managing users, accounts and account statements (Santander Dev Week 2026).
  version: 0.0.1-SNAPSHOT
  license:
    name: Apache-2.0
    identifier: Apache-2.0
security: []
servers:
- url: /
  description: Default Server URL
tags:
- name: Users Controller
  description: RESTful API for managing users.
- name: Transactions Controller
  description: RESTful API for account statements.
paths:
  /users:
    get:
      tags:
      - Users Controller
      summary: Get all users
      description: Retrieve a paged list of all registered users, optionally filtered by name
      operationId: findAll
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      - $ref: '#/components/parameters/SortParam'
      - name: name
        in: query
        description: Partial, case-insensitive name filter
        required: false
        schema:
          type: string
      # The list endpoint returns 200; errors are handled by GlobalExceptionHandler as a 500.
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUserDto'
    post:
      tags:
      - Users Controller
      summary: Create a new user
      description: Create a new user and return the created user's data
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
        required: true
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '422':
          $ref: '#/components/responses/PlainError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users/check:
    get:
      tags:
      - Users Controller
      summary: Check account/card number uniqueness
      description: Returns whether the given account and card numbers are still free. Pass excludeId when editing so the user's own numbers don't collide with themselves.
      operationId: checkUniqueness
      parameters:
      - name: accountNumber
        in: query
        required: false
        schema:
          type: string
      - name: cardNumber
        in: query
        required: false
        schema:
          type: string
      - name: excludeId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniquenessCheckDto'
  /users/{id}:
    get:
      tags:
      - Users Controller
      summary: Get a user by ID
      description: Retrieve a specific user based on its ID
      operationId: findById
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          $ref: '#/components/responses/PlainError'
    put:
      tags:
      - Users Controller
      summary: Update a user
      description: Update the data of an existing user based on its ID
      operationId: updateUser
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
        required: true
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          $ref: '#/components/responses/PlainError'
        '422':
          $ref: '#/components/responses/PlainError'
    delete:
      tags:
      - Users Controller
      summary: Delete a user
      description: Delete an existing user based on its ID
      operationId: deleteUser
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: User deleted successfully
        '404':
          $ref: '#/components/responses/PlainError'
  /accounts/transactions/summary:
    get:
      tags:
      - Transactions Controller
      summary: Transaction totals by type
      description: Aggregate SUM(amount) and COUNT per transaction type across all accounts. Types with no rows are omitted (the frontend zero-fills them).
      operationId: summarizeByType
      # The summary endpoint returns 200; errors are handled by GlobalExceptionHandler as a 500.
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionTypeSummaryDto'
  /accounts/{id}/transactions:
    get:
      tags:
      - Transactions Controller
      summary: List transactions
      description: Retrieve a paged statement for an account (newest first)
      operationId: findByAccountId
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTransactionDto'
        '404':
          $ref: '#/components/responses/PlainError'
    post:
      tags:
      - Transactions Controller
      summary: Create a transaction
      description: "DEPOSIT adds, WITHDRAWAL/PAYMENT/TRANSFER subtract from the balance. A TRANSFER is double-entry: it also writes a credit leg (type TRANSFER, credit=true) on the destination account. The response is the DEBIT leg on the source. Idempotent: send an Idempotency-Key header per intent; a retry with the same key returns the original transaction instead of debiting twice."
      operationId: createTransaction
      parameters:
      - $ref: '#/components/parameters/PathId'
      - name: Idempotency-Key
        in: header
        required: false
        description: UUID per intent; retries with the same key are deduplicated (per account)
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequestDto'
        required: true
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDto'
        '404':
          $ref: '#/components/responses/PlainError'
        '422':
          $ref: '#/components/responses/PlainError'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PageParam:
      name: page
      in: query
      description: Zero-based page index
      required: false
      schema:
        type: integer
        format: int32
        default: 0
    SizeParam:
      name: size
      in: query
      description: Page size
      required: false
      schema:
        type: integer
        format: int32
        default: 20
    SortParam:
      name: sort
      in: query
      description: Sort as `property,direction` (e.g. `account.balance,desc`). Repeatable.
      required: false
      schema:
        type: array
        items:
          type: string
  responses:
    PlainError:
      description: Plain-text error message (from GlobalExceptionHandler)
      content:
        text/plain:
          schema:
            type: string
          example: Resource not found.
    RateLimited:
      description: Too many write requests from this IP (rate-limit.max-requests per window)
      content:
        text/plain:
          schema:
            type: string
          example: Too many requests. Try again shortly.
  schemas:
    AccountDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        agency:
          type: string
        balance:
          type: number
        limit:
          type: number
      required:
      - number
      - agency
    CardDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        limit:
          type: number
      required:
      - number
    FeatureDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        icon:
          type: string
        description:
          type: string
      required:
      - description
    NewsDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        icon:
          type: string
        description:
          type: string
      required:
      - description
    UniquenessCheckDto:
      type: object
      properties:
        accountNumberAvailable:
          type: boolean
        cardNumberAvailable:
          type: boolean
    UserDto:
      type: object
      required:
      - name
      - account
      - card
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        account:
          $ref: '#/components/schemas/AccountDto'
        card:
          $ref: '#/components/schemas/CardDto'
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureDto'
        news:
          type: array
          items:
            $ref: '#/components/schemas/NewsDto'
    Page:
      type: object
      properties:
        content:
          type: array
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/Sort'
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/Pageable'
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/Sort'
        offset:
          type: integer
          format: int64
        paged:
          type: boolean
        unpaged:
          type: boolean
    Sort:
      type: object
      properties:
        sorted:
          type: boolean
        unsorted:
          type: boolean
        empty:
          type: boolean
    PageUserDto:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/UserDto'
    PageTransactionDto:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/TransactionDto'
    TransactionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: number
        accountId:
          type: integer
          format: int64
        destinationAccountId:
          type:
          - integer
          - 'null'
          format: int64
        createdAt:
          type: string
          format: date-time
        credit:
          type: boolean
          description: true = credit (deposit, or the incoming leg of a transfer); false = debit
    TransactionRequestDto:
      type: object
      required:
      - type
      - amount
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: number
          description: Must be greater than zero, at most 2 decimal places
          exclusiveMinimum: 0
        destinationAccountId:
          type: integer
          format: int64
          description: Required for TRANSFER (must be > 0); ignored otherwise
    TransactionTypeSummaryDto:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        total:
          type: number
        count:
          type: integer
          format: int64
    TransactionType:
      type: string
      enum:
      - DEPOSIT
      - WITHDRAWAL
      - TRANSFER
      - PAYMENT
