<div class="page-container">
  <h2>{{ isEdit ? 'Editar usuário' : 'Novo usuário' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="user-form">
    <mat-form-field appearance="outline">
      <mat-label>Nome *</mat-label>
      <input matInput formControlName="name" placeholder="Nome completo" autofocus />
      <mat-error *ngIf="showError(form.get('name'))">Nome é obrigatório.</mat-error>
    </mat-form-field>

    <fieldset formGroupName="account" class="section">
      <legend>Conta</legend>
      <mat-form-field appearance="outline">
        <mat-label>Número *</mat-label>
        <input matInput formControlName="number" placeholder="0000" />
        <mat-error *ngIf="showError(form.get('account.number'))">Número é obrigatório.</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Agência *</mat-label>
        <input matInput formControlName="agency" placeholder="0001" />
        <mat-error *ngIf="showError(form.get('account.agency'))">Agência é obrigatória.</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Saldo</mat-label>
        <span matTextPrefix>R$&nbsp;</span>
        <input matInput type="number" formControlName="balance" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Limite</mat-label>
        <span matTextPrefix>R$&nbsp;</span>
        <input matInput type="number" formControlName="limit" />
      </mat-form-field>
    </fieldset>

    <fieldset formGroupName="card" class="section">
      <legend>Cartão</legend>
      <mat-form-field appearance="outline">
        <mat-label>Número *</mat-label>
        <input matInput formControlName="number" placeholder="**** **** **** 0000" />
        <mat-error *ngIf="showError(form.get('card.number'))">Número é obrigatório.</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Limite</mat-label>
        <span matTextPrefix>R$&nbsp;</span>
        <input matInput type="number" formControlName="limit" />
      </mat-form-field>
    </fieldset>

    <fieldset class="section">
      <legend>Features</legend>
      <div formArrayName="features">
        <div *ngFor="let feature of features.controls; let i = index" [formGroupName]="i" class="repeat-row">
          <mat-form-field appearance="outline">
            <mat-label>Descrição</mat-label>
            <input matInput formControlName="description" />
          </mat-form-field>
          <button mat-icon-button type="button" (click)="removeFeature(i)" aria-label="Remover feature">
            <mat-icon>remove_circle</mat-icon>
          </button>
        </div>
      </div>
      <button mat-button type="button" (click)="addFeature()">
        <mat-icon>add</mat-icon> Feature
      </button>
    </fieldset>

    <fieldset class="section">
      <legend>News</legend>
      <div formArrayName="news">
        <div *ngFor="let item of news.controls; let i = index" [formGroupName]="i" class="repeat-row">
          <mat-form-field appearance="outline">
            <mat-label>Descrição</mat-label>
            <input matInput formControlName="description" />
          </mat-form-field>
          <button mat-icon-button type="button" (click)="removeNews(i)" aria-label="Remover notícia">
            <mat-icon>remove_circle</mat-icon>
          </button>
        </div>
      </div>
      <button mat-button type="button" (click)="addNews()">
        <mat-icon>add</mat-icon> Notícia
      </button>
    </fieldset>

    <div class="actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || saving">
        <mat-icon *ngIf="!saving">save</mat-icon>
        <mat-spinner *ngIf="saving" diameter="18" class="submit-spinner"></mat-spinner>
        {{ saving ? 'Salvando…' : 'Salvar' }}
      </button>
      <button mat-button type="button" routerLink="/users" [disabled]="saving">Cancelar</button>
    </div>
  </form>
</div>
