# Distinguish SPA navigation from API calls on shared paths.
# $is_args is "?" when a query string is present, empty otherwise.
#   GET /users            -> "GET"     -> SPA (bare navigation, no query)
#   GET /users?page=..    -> "GET?"    -> API (list XHR always has page/size)
#   POST /users           -> "POST"    -> API (create)
#   GET /users/check?...  -> "GET?"    -> API
map "$request_method$is_args" $api_backend {
    default 1;   # everything proxies to the backend
    "GET" 0;     # bare GET (no query string) = SPA route
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API paths: auth, audit, /users list/check/CRUD, /accounts statements.
    # SPA routes (/users/new, /users/{id}/edit, /users/{id}/transactions,
    # /dashboard) do NOT match -> served by the SPA fallback below.
    location ~ ^/(auth/(login|register|refresh|logout)|audit|users$|users/check$|users/[0-9]+$|accounts/[0-9]+/transactions$|accounts/transactions/summary$) {
        if ($api_backend = 0) {
            rewrite ^ /index.html break;
        }
        proxy_pass http://santander-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
