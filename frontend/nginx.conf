server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests are proxied to the backend service (mirrors proxy.conf.json).
    # Matches /users (list + CRUD with numeric id) but NOT the SPA routes
    # /users/new and /users/{id}/edit, which fall through to the SPA fallback.
    # /accounts/{id}/transactions (statement + create) is also API, not SPA.
    location ~ ^/users$|^/users/[0-9]+$|^/accounts/[0-9]+/transactions$ {
        proxy_pass http://santander-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
