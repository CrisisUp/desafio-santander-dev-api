name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java + Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew test --no-daemon

  etl:
    name: ETL (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests (vitest)
        run: npm run test:ci
      - name: Build (production)
        run: npm run build -- --configuration=production

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start the API
        run: |
          ./gradlew bootRun --no-daemon > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "OK: API healthy"; exit 0
            fi
            sleep 5
          done
          echo "FAIL: API did not start"; tail -50 /tmp/api.log; exit 1
      - name: Run E2E (Playwright)
        run: npx playwright test

  integration:
    name: Integration (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, etl, frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build JAR (required by the API image)
        run: ./gradlew clean bootJar --no-daemon
      - name: Start the full stack
        run: docker compose up --build -d
      - name: Wait for API healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "OK: API healthy"; exit 0
            fi
            sleep 5
          done
          echo "FAIL: API did not become healthy"; exit 1
      - name: Wait for ETL to finish
        run: |
          for i in $(seq 1 24); do
            state=$(docker compose ps -a --format '{{.State}}' etl-pipeline 2>/dev/null || true)
            if [ "$state" = "exited" ]; then
              echo "OK: ETL finished"; exit 0
            fi
            sleep 5
          done
          echo "FAIL: ETL did not finish"; exit 1
      - name: Validate end-to-end
        run: |
          curl -sf http://localhost:4200/ | grep -q "Santander Dev Week" \
            || { echo "FAIL: frontend title missing"; exit 1; }
          curl -sf "http://localhost:4200/users?page=0&size=5" | grep -q "Devweekerson" \
            || { echo "FAIL: proxy/seed missing"; exit 1; }
          ls etl-pipeline/data/output/user_*_updated.json >/dev/null 2>&1 \
            || { echo "FAIL: ETL output missing"; exit 1; }
          echo "OK: Integration validated end-to-end"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs || true
      - name: Teardown
        if: always()
        run: docker compose down -v || true

  integration-postgres:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [backend, etl, frontend]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: santander
          POSTGRES_USER: santander
          POSTGRES_PASSWORD: santander
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U santander"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build JAR
        run: ./gradlew clean bootJar --no-daemon
      - name: Start API with PostgreSQL
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prd.yml up --build -d
      - name: Wait for API healthy
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "OK: API healthy"; exit 0
            fi
            sleep 5
          done
          echo "FAIL: API did not become healthy"; exit 1
      - name: Run backend tests against PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: santander
          PGUSER: santander
          PGPASSWORD: santander
        run: ./gradlew test --no-daemon
      - name: Validate end-to-end
        run: |
          curl -sf http://localhost:4200/ | grep -q "Santander Dev Week" \
            || { echo "FAIL: frontend title missing"; exit 1; }
          curl -sf "http://localhost:4200/users?page=0&size=5" | grep -q "Devweekerson" \
            || { echo "FAIL: proxy/seed missing"; exit 1; }
          echo "OK: Integration validated end-to-end"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prd.yml logs || true
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prd.yml down -v || true
