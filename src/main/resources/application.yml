# Base configuration. The `dev` profile is the default (see application-dev.yml).
spring:
  application:
    name: santander-dev-week-2023-api
  profiles:
    default: dev
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false

# CORS is restricted to the Angular dev server by default.
cors:
  allowed-origins: http://localhost:4200

# Per-IP rate limit for write requests (POST). Backed by Redis in production
# (shared budget across instances); falls back to an in-memory budget when Redis
# is unavailable. The dev/test profiles leave redis-enabled=false.
rate-limit:
  max-requests: 20
  window-seconds: 60
  redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:false}

# JWT authentication. The dev secret is fine for local use; MUST be overridden
# in production (AUTH_JWT_SECRET env var) with a long random value.
auth:
  jwt-secret: ${AUTH_JWT_SECRET:dev-only-secret-key-please-change-in-production-0123456789abcdef}
  # Access token lifetime: short-lived by design; the client refreshes via the
  # opaque refresh token (auth.refresh-token-ms).
  access-token-ms: ${AUTH_ACCESS_TOKEN_MS:900000}
  refresh-token-ms: ${AUTH_REFRESH_TOKEN_MS:604800000}
