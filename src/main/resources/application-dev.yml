spring:
  datasource:
    # File-backed H2 so dev data (transactions, users) survives restarts.
    # ./data is git-ignored. DB_CLOSE_ON_EXIT=FALSE keeps the DB open while
    # other tools inspect it; Flyway applies on first run.
    url: jdbc:h2:file:./data/sdw2023;DB_CLOSE_ON_EXIT=FALSE
    username: sdw2023
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
