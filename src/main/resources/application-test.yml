# Test profile: isolated in-memory H2 without the H2 console / dev conveniences.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate

# Rate limit off in tests: MockMvc suites make many POSTs from one IP.
rate-limit:
  enabled: false
