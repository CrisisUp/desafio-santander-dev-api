spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

cors:
  # Define o domínio do seu frontend em produção (ex.: https://app.santander.com.br)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
